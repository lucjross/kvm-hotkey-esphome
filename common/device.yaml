# Everything that isn't about a particular KVM: the board, networking, and the
# USB keyboard itself. kvm.yaml pulls this in alongside one file from kvms/.
#
# Each substitution below is a default; set it in kvm.yaml to override.

substitutions:
  device_name: kvm
  friendly_name: KVM
  # Any ESP32-S2 or ESP32-S3 board with native USB works. Other ESP32 variants
  # have no USB device peripheral and cannot be a keyboard.
  board: adafruit_qtpy_esp32s2
  # Raise both if the KVM misses keys in a hotkey sequence.
  key_hold: 20ms
  key_gap: 30ms

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: ${board}
  framework:
    # Required: this component uses esp_tinyusb directly. Current ESPHome
    # defaults ESP32 to esp-idf anyway, but releases before ~2025.8 defaulted to
    # Arduino, so state it explicitly to stay portable across versions.
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  # USB_CDC is the *default* on the ESP32-S2 and shares the USB OTG peripheral
  # with our HID device, so it has to be moved off. The QT Py breaks out no
  # UART0 pins (GPIO43/44 are not on the castellations) and the S2 has no
  # USB-Serial-JTAG, so baud_rate: 0 turns serial logging off entirely.
  # Every log line comes over WiFi via the API instead. On a board that does
  # break out UART0, a real baud rate here gets you a serial console back.
  hardware_uart: UART0
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

usb_hid_keyboard:
  # Every file in kvms/ refers to the keyboard by this id.
  id: kbd
  usb_manufacturer_str: "ESPHome"
  usb_product_str: "KVM Control"
  key_hold: ${key_hold}
  key_gap: ${key_gap}
